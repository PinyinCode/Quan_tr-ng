name: Run New Story Updater

on:
  workflow_dispatch: # Kích hoạt thủ công trên giao diện GitHub

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl

      - name: Run script update stories
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
        run: |
          python vocab_data/update_stories_only.py

      - name: Commit and push updated json file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai_mnemonics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "✨ Auto-update short mnemonic stories [skip ci]" && git push)
