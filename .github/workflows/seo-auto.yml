name: Auto Optimize SEO & Favicon

on:
  push:
    branches:
      - main  # Hoặc master tùy theo nhánh của bạn

permissions:
  contents: write

jobs:
  seo-optimization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SEO & Favicon Optimizer
        run: python3 scripts/seo_optimizer.py

      - name: Commit and push changes if index.html updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git status
          if git diff --cached --quiet; then
            echo "Không có thay đổi nào cần commit."
          else
            git commit -m "🤖 Auto-optimized SEO and Favicon via GitHub Actions"
            git push
          fi
