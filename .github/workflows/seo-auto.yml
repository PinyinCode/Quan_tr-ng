name: Auto Optimize SEO & Favicon

on:
  push:
    branches:
      - main  # Hoặc master tùy theo nhánh của anh

permissions:
  contents: write

jobs:
  seo-optimization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Kiểm tra và liệt kê các file để xác định đúng vị trí chạy
      - name: List files for debugging
        run: ls -la

      # Chạy script Python đúng cách
      - name: Run SEO Optimizer Script
        run: python seo_optimizer.py

      - name: Commit and push changes if index.html updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Auto-optimized SEO and Favicon via GitHub Actions"
            git push
          fi
