name: Expand Chinese Vocabulary with Qwen AI

on:
  workflow_dispatch:
  push:
    branches:
      - main # Hoặc master tùy nhánh của bạn

jobs:
  run-ai-expansion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas openpyxl openai

      - name: Run Python script to process all excel files
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
        run: |
          python -u process_vocab.py

      - name: Commit and Push expanded Excel files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/data_copy/
          git commit -m "Auto-generate expanded vocabulary files in scripts/data_copy using Qwen AI" || echo "No changes to commit"
          git push
