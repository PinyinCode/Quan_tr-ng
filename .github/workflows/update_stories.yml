name: Run New Story Updater

on:
  workflow_dispatch:
    inputs:
      limit_words:
        description: 'Số từ muốn xử lý (Nhập 20 để chạy thử, nhập 0 để chạy hết 11237 từ)'
        required: true
        default: '20'

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai openpyxl

      - name: Run script update stories
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          LIMIT_WORDS: ${{ github.event.inputs.limit_words }}
        run: |
          python -u vocab_data/update_stories_only.py

      - name: Final commit and push updated json file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Thêm file vào staging area
          git add data/ai_mnemonics.json
          
          # 2. Kiểm tra xem có thay đổi nào không. Nếu có thì commit
          if ! git diff --staged --quiet; then
            git commit -m "✨ Final update for mnemonic stories [skip ci]"
          else
            echo "Không có thay đổi nào để commit."
          fi
          
          # 3. Bây giờ index đã sạch, tiến hành pull --rebase an toàn
          git pull --rebase origin main
          
          # 4. Push lên remote
          git push
